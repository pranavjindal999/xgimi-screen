send_key:
  name: Send remote key
  description: Press a remote key on the projector (D-pad, OK, Back, or Home).
  fields:
    entity_id:
      name: Projector entity
      description: Any entity from this projector, such as the Screen switch.
      required: true
      selector:
        entity:
          integration: xgimi_screen
    key:
      name: Key
      description: Which remote key to press.
      required: true
      selector:
        select:
          options:
            - "up"
            - "down"
            - "left"
            - "right"
            - "ok"
            - "back"
            - "home"
